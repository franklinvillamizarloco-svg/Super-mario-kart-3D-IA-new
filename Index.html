<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Super Mario Kart 3D</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
    <div id="title-screen">
        <h1 class="glow">SUPER MARIO KART 3D</h1>
        <p class="subtitle">EDICIÓN ANDROID EXCLUSIVA</p>
        <button id="start-btn" class="btn pulse">¡TOCA PARA JUGAR!</button>
    </div>
    
    <div id="menu-screen" class="hidden">
        <h2>SELECCIÓN DE CARRERA</h2>
        <div class="menu-box">
            <h3>Cilindrada</h3>
            <div class="btn-row" id="cc-sel">
                <button class="opt active" data-val="50">50 CC</button>
                <button class="opt" data-val="100">100 CC</button>
                <button class="opt" data-val="150">150 CC</button>
                <button class="opt" data-val="200">200 CC</button>
            </div>
        </div>
        <div class="menu-box">
            <h3>Vehículo</h3>
            <div class="btn-row" id="veh-sel">
                <button class="opt active" data-val="kart">🏎️ Kart Clásico</button>
                <button class="opt" data-val="moto">🏍️ Super Moto</button>
            </div>
        </div>
        <button id="next-btn" class="btn green">SIGUIENTE ➔</button>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/menu.js"></script>
</body>
                  </html>
